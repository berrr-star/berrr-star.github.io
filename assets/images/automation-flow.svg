<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">公告数据自动化流程示意图</title>
  <desc id="desc">从311份公告到875条详情，再经过清洗整理与格式校验的自动化流程。</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="14" stdDeviation="22" flood-color="#1C1C1C" flood-opacity=".07"/></filter>
    <style>
      .bg{fill:#fbfbfb}.ink{fill:#1c1c1c}.muted{fill:#8b8b8b}.line{stroke:#d9d9d9;stroke-width:2}.accent{fill:#00a6c7}.card{fill:#fff;stroke:#e6e6e6;stroke-width:2}.label{font:600 22px -apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;fill:#1c1c1c}.small{font:400 18px -apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;fill:#8b8b8b}.num{font:600 82px -apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif;fill:#1c1c1c;letter-spacing:-4px}.step{font:600 16px -apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif;fill:#00a6c7;letter-spacing:2px}
    </style>
  </defs>
  <rect width="1200" height="760" rx="36" class="bg"/>
  <text x="70" y="82" class="step">WORKFLOW / 示意图</text>
  <text x="70" y="132" class="label" style="font-size:32px">把重复整理，变成可复用流程。</text>
  <path d="M266 336H352M590 336H676M914 336H1000" class="line"/>
  <path d="M334 326l18 10-18 10M658 326l18 10-18 10M982 326l18 10-18 10" fill="none" stroke="#00a6c7" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <g filter="url(#shadow)">
    <rect x="70" y="210" width="196" height="252" rx="24" class="card"/>
    <rect x="394" y="210" width="196" height="252" rx="24" class="card"/>
    <rect x="718" y="210" width="196" height="252" rx="24" class="card"/>
    <rect x="1000" y="210" width="130" height="252" rx="24" class="card"/>
  </g>
  <text x="98" y="254" class="small">01 / 采集</text>
  <text x="96" y="350" class="num">311</text>
  <text x="98" y="398" class="label">份公告</text>
  <text x="422" y="254" class="small">02 / 展开</text>
  <text x="420" y="350" class="num">875</text>
  <text x="422" y="398" class="label">条详情</text>
  <text x="746" y="254" class="small">03 / 整理</text>
  <circle cx="772" cy="311" r="8" class="accent"/>
  <path d="M794 311h88M746 345h136M746 379h136" class="line"/>
  <text x="746" y="425" class="label">字段结构化</text>
  <text x="1022" y="254" class="small">04</text>
  <path d="M1036 317l22 22 42-52" fill="none" stroke="#00a6c7" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="1022" y="398" class="label">校验</text>
  <rect x="70" y="550" width="1060" height="120" rx="24" fill="#f0f0f0"/>
  <text x="102" y="600" class="label">Chrome CDP＋Python</text>
  <text x="102" y="638" class="small">采集、整理、脚本流水线与交付前核对</text>
  <text x="1088" y="626" text-anchor="end" class="small">不展示原始公司与公告数据</text>
</svg>
